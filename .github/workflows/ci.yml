name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefix Back
      - run: npm ci --prefix Front
      - run: npm --prefix Back run build
      - run: npm --prefix Front run build
      - run: npm --prefix Back test
      - run: npm --prefix Front test
